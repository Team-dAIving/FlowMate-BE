
name: FlowMate CI/CD

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: flowmate-production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Login EC2 to GHCR
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy to EC2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
            set -Eeuo pipefail

            IMAGE="ghcr.io/team-daiving/flowmate-be:latest"
            CONTAINER="flowmate-backend"
            ENV_FILE="/opt/flowmate/backend.env"

            if ! sudo -n test -f "$ENV_FILE"; then
              echo "Missing environment file: $ENV_FILE" >&2
              exit 1
            fi

            PREVIOUS_IMAGE="$(sudo -n docker inspect --format '{{.Image}}' "$CONTAINER")"
            sudo -n docker pull "$IMAGE"
            sudo -n docker stop "$CONTAINER"
            sudo -n docker rm "$CONTAINER"

            start_container() {
              sudo -n docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                --env-file "$ENV_FILE" \
                -p 127.0.0.1:8081:8080 \
                "$1"
            }

            if ! start_container "$IMAGE"; then
              echo "New container could not be created. Rolling back." >&2
              start_container "$PREVIOUS_IMAGE"
              exit 1
            fi

            for attempt in $(seq 1 30); do
              if curl --fail --silent --output /dev/null \
                "http://127.0.0.1:8081/oauth2/authorization/github?client=web&state=deploy-health-check"; then
                echo "Deployment completed successfully."
                exit 0
              fi
              sleep 2
            done

            echo "New container failed its startup check. Rolling back." >&2
            sudo -n docker logs --tail 100 "$CONTAINER" >&2 || true
            sudo -n docker rm -f "$CONTAINER" || true
            start_container "$PREVIOUS_IMAGE"
            exit 1
          REMOTE
