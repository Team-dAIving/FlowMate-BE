spring:
    datasource:
        url: jdbc:h2:mem:flowmate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
        username: sa
        password:
        driver-class-name: org.h2.Driver
    jpa:
        hibernate:
            ddl-auto: create-drop
        properties:
            hibernate:
                format_sql: true
        open-in-view: false
    security:
        oauth2:
            client:
                registration:
                    github:
                        client-id: test-client-id
                        client-secret: test-client-secret

app:
    storage:
        s3:
            region: ap-northeast-2
            bucket: flowmate-test-recordings
            recording-prefix: flowmate/meetings
            upload-url-ttl: PT15M
    meeting:
        stt-poll-interval: PT1H
    ai:
        base-url: http://127.0.0.1:8001
    github:
        slug: flowmate-test
        app-id: 1
        private-key-base64: test-private-key
        webhook-secret: test-webhook-secret
    auth:
        jwt-secret: test-jwt-secret-must-be-at-least-32-bytes-long
