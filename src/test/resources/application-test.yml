spring:
    datasource:
        url: jdbc:h2:mem:flowmate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
        username: sa
        password:
        driver-class-name: org.h2.Driver
    jpa:
        hibernate:
            ddl-auto: create-drop
        properties:
            hibernate:
                format_sql: true
        open-in-view: false
    security:
        oauth2:
            client:
                registration:
                    github:
                        client-id: test-client-id
                        client-secret: test-client-secret

app:
    auth:
        jwt-secret: test-jwt-secret-must-be-at-least-32-bytes-long
