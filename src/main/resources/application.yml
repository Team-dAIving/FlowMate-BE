spring:
    application:
        name: FlowMate-BE
    datasource:
        url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:flowmate}
        username: ${POSTGRES_USER:postgres}
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: ${JPA_DDL_AUTO:validate}
        properties:
            hibernate:
                format_sql: true
                jdbc:
                    time_zone: UTC
    security:
        oauth2:
            client:
                registration:
                    github:
                        client-id: ${GITHUB_CLIENT_ID}
                        client-secret: ${GITHUB_CLIENT_SECRET}
                        scope:
                            - read:user
                            - user:email

server:
    forward-headers-strategy: framework

app:
    ai:
        base-url: ${AI_BASE_URL:http://127.0.0.1:8001}
    github:
        slug: ${GITHUB_APP_SLUG:}
        app-id: ${GITHUB_APP_ID:}
        private-key-base64: ${GITHUB_APP_PRIVATE_KEY_BASE64:}
        webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
        installation-state-ttl: ${GITHUB_INSTALLATION_STATE_TTL:PT10M}
    auth:
        jwt-secret: ${JWT_SECRET}
        jwt-issuer: ${JWT_ISSUER:flowmate}
        access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
        frontend-origin: ${FRONTEND_ORIGIN:https://flow-mate-fe.vercel.app}
        frontend-redirect-uri: ${FRONTEND_OAUTH_REDIRECT_URI:https://flow-mate-fe.vercel.app/oauth/callback}
        desktop-redirect-uri: ${DESKTOP_OAUTH_REDIRECT_URI:flowmate://oauth/callback}
        oauth-code-ttl: ${OAUTH_CODE_TTL:PT2M}
